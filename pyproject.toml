[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covt-pilot"
version = "0.1.0"
description = "Controlled experiments on CoVT depth visualization and answer formation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<12"]

[project.optional-dependencies]
model = ["torch==2.5.1", "transformers==4.50.1", "accelerate>=1.3,<2", "safetensors>=0.4.5,<1", "huggingface-hub>=0.27,<1", "opencv-python>=4.8,<5", "torchvision==0.20.1"]
report = ["matplotlib>=3.8,<4", "reportlab>=4,<5", "lxml>=5,<7", "pypdf>=5,<7", "pypdfium2>=4,<6"]
test = ["pytest>=8,<9", "torch>=2.5,<2.7", "safetensors>=0.4.5,<1"]

[project.scripts]
covt-pilot = "covt_pilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
